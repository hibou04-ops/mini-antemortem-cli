name: publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-build:
    name: verify and build
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-ref.outputs.release_tag }}
    steps:
      - name: Resolve release ref
        id: release-ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release ref must look like v1.2.3; got ${release_tag}" >&2
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-ref.outputs.release_tag }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build, test, and MCP tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      - name: Verify version agreement (tag == pyproject == __init__)
        env:
          RELEASE_TAG: ${{ steps.release-ref.outputs.release_tag }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["RELEASE_TAG"]
          tag_version = tag[1:] if tag.startswith("v") else tag

          with open("pyproject.toml", "rb") as fh:
              pyproject_version = tomllib.load(fh)["project"]["version"]

          init_src = open("src/mini_antemortem_cli/__init__.py", encoding="utf-8").read()
          m = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_src, re.M)
          if not m:
              print("FAIL: __version__ not found in __init__.py", file=sys.stderr)
              sys.exit(1)
          init_version = m.group(1)

          print(f"tag={tag_version} pyproject={pyproject_version} __init__={init_version}")
          if not (tag_version == pyproject_version == init_version):
              print(
                  "FAIL: version mismatch — the release tag, pyproject.toml "
                  "[project].version, and __init__.__version__ must all match.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("VERSION_AGREEMENT_OK")
          PY

      - name: Run deterministic verification
        run: |
          python -m pytest -q
          python scripts/generate_readme_claims.py --check
          python scripts/check_repo_consistency.py
          python examples/demo_replay.py
          python scripts/run_golden_cases.py --check
          python scripts/verify_fixture_integrity.py
          python scripts/release_audit.py --no-network

      - name: Build distributions
        run: python -m build

      - name: Smoke install built wheel
        run: python scripts/wheel_smoke_install.py dist/*.whl

      - name: Publish readiness gate
        run: python scripts/publish_readiness.py --no-network

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.release-ref.outputs.release_tag }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: verify-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.verify-build.outputs.release_tag }}
          path: dist

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
