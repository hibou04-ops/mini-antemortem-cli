name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"
      - name: Run pytest
        run: python -m pytest -q
      - name: Check generated claims
        run: python scripts/generate_readme_claims.py --check
      - name: Check repository consistency
        run: python scripts/check_repo_consistency.py
      - name: Replay deterministic demo
        run: python examples/demo_replay.py
      - name: Run golden cases
        run: python scripts/run_golden_cases.py --check
      - name: Run false-positive audit
        run: python scripts/run_false_positive_audit.py --check --out benchmarks/false_positive/last_report.json
      - name: Upload false-positive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: false-positive-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: benchmarks/false_positive/last_report.json
          if-no-files-found: warn
      - name: Verify fixture integrity
        run: python scripts/verify_fixture_integrity.py
      - name: Release audit
        run: python scripts/release_audit.py --no-network
      - name: Build wheel
        run: python -m build
      - name: Wheel smoke install
        run: python scripts/wheel_smoke_install.py dist/*.whl
